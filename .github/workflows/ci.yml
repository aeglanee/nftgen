# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: ci

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
  # Weekly, even with no commits: PyYAML/pytest/pre-commit are ranges, not
  # pins, so a new upstream release can break us without a Renovate PR.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dev dependencies
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'

      - name: Lint (ruff / yamllint / markdownlint / gitleaks)
        run: make lint

      # same check as `make lint-links`: local files + anchors, offline
      - name: Markdown links (offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >-
            --no-progress --config .lychee.toml
            --remap 'https://github\.com/aeglanee/nftgen/(?:blob|tree)/main/(.*) file://${{ github.workspace }}/$1'
            '*.md' 'docs/**/*.md' 'example*/**/*.md'

  test:
    name: tests + nft -c (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # every Python `requires-python` (>=3.11) claims to support
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install nftables + iproute2 (for nft -c and the netns harness)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iproute2

      - name: Install dev dependencies
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'

      # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor, which
      # blocks the rootless `unshare -rn nft -c` path and the netns harness.
      # Re-enable them so `nft -c` and the behavioral suite actually run.
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      # Fail loud if the runner can't run nft -c — otherwise the nft-dependent
      # and behavioral tests would silently skip and we'd lose that coverage.
      - name: Assert nft -c + netns are usable
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from nftgen import validate
          from tests.behavioral.netns import can_netns
          assert validate.nft_available(), "nft binary not on PATH"
          assert validate.can_check(), "nft -c not usable (no netlink and no userns)"
          assert can_netns(), "netns harness unusable — behavioral tests would skip"
          print("nft -c and netns both usable")
          PY

      - name: Tests (unit + golden + nft -c + behavioral netns)
        run: make test

      - name: Build examples + nft -c
        run: |
          set -euo pipefail
          .venv/bin/nftgen build example --check
          .venv/bin/nftgen build example-fleet --check

      - name: Drift gate (committed artifacts reproduce from source)
        run: |
          set -euo pipefail
          .venv/bin/nftgen build example-fleet
          git diff --exit-code -- example-fleet/generated \
            || { echo "::error::example-fleet/generated is stale — regenerate and commit"; exit 1; }
