---
# B32: `pair` plus the mark restored on the incoming packets too, so a
# reverse-path check (§5 `fib`, kernel rp_filter) routes them by the mark.
tables:
  - family: inet
    name: pairmark
    chains:
      - name: prerouting
        hook: prerouting
        type: filter
        priority: mangle
        policy: accept
        rules:
          - iifname: peer
            ct: [new]
            set-ct-mark: "0x1"
          - ct-mark: "0x1"
            set-mark: ct-mark
      - name: output
        hook: output
        type: route
        priority: mangle
        policy: accept
        rules:
          - ct-mark: "0x1"
            set-mark: ct-mark
