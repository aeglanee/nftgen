[project]
name = "nftgen"
version = "0.7.0"
description = "nftables firewall generator: YAML definitions and host policies → a native nftables ruleset"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "aeglanee" }]
keywords = ["nftables", "nft", "firewall", "firewall-as-code", "netfilter", "linux", "ansible"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking :: Firewalls",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Source = "https://github.com/aeglanee/nftgen"
Documentation = "https://github.com/aeglanee/nftgen/blob/main/docs/authoring.md"
Changelog = "https://github.com/aeglanee/nftgen/blob/main/CHANGELOG.md"
Issues = "https://github.com/aeglanee/nftgen/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = [
  "pytest>=8.0",
  "ruff==0.15.20",    # keep in sync with .pre-commit-config.yaml
  "yamllint==1.38.0", # keep in sync with .pre-commit-config.yaml
  "pre-commit>=4.0",
]

[project.scripts]
nftgen = "nftgen.cli:main"

[build-system]
requires = ["hatchling>=1.27"]  # license-files (PEP 639)
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nftgen"]
core-metadata-version = "2.4"  # what PyPI and twine read; 2.5 is rejected

[tool.hatch.build.targets.sdist]
# source + tests and their fixtures; never local tool state (.trunk, .venv)
include = ["/nftgen", "/tests", "/example", "/example-fleet", "/CHANGELOG.md"]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "C4",  # flake8-comprehensions
  "RET", # flake8-return
  "PL",  # pylint
  "S",   # flake8-bandit
]
ignore = [
  "E501",    # formatter owns line-length wrapping
  "PLR2004", # magic values are fine in tests and rendering tables
]

[tool.ruff.lint.per-file-ignores]
# pytest asserts; the netns harness runs fixed PATH-resolved commands
# (ip/nft/unshare) and binds inside throwaway namespaces
"tests/**" = ["S101", "S603", "S607", "S104"]
