---
# Accepts both services; the foreign table drops 7001 on its own. With
# `reset: own-tables` that foreign drop must survive every apply.
reset: own-tables
tables:
  - family: inet
    name: filter
    chains:
      - name: input
        hook: input
        type: filter
        priority: filter
        policy: drop
        rules:
          - ct: [established, related]
            action: accept
          - iifname: lan_if
            saddr: lan_net
            proto: tcp
            dport: [svc, foreign_blocked]
            action: accept
