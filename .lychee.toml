# Offline link check (make links): local files and their anchors only, never
# a network request. The README's absolute links to this repo on GitHub are
# remapped to the local files under /src, where the makefile mounts the repo.
offline = true
include_fragments = "full"
exclude_path = [".git", ".venv", "dist"]
remap = ['https://github\.com/aeglanee/nftgen/(?:blob|tree)/main/(.*) file:///src/$1']
